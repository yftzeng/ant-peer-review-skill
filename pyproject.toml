[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-peer-review"
version = "0.1.0"
description = "Multi-model article drafting and audit workflow (CLI + Claude skill)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
render = ["playwright>=1.40"]
test = ["pytest>=8"]

[project.scripts]
ant-peer-review = "ant_peer_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ant_peer_review = ["locales/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
