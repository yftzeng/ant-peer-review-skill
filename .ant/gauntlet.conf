# The gauntlet for this repo: `ant evidence <name> --tier N` runs every layer
# with tier <= N, in one fresh run, and writes the report.
#
#   name | tier | expect | command
#
# tier    1 = every change, 2 = normal changes, 3 = money, auth, data loss,
#         concurrency, public API
# expect  pass        = must exit 0
#         fail:<ERE>  = a negative control: must exit non-zero (not 126/127),
#                       with a log matching <ERE> -- proves a home-grown check
#                       sees the defect it claims to catch (<ERE> has no `|`)
#
# `ant spec approve` binds this file: editing it afterwards is drift.
# `ant gauntlet lint` refuses a layer that cannot fail (`|| true`,
# `2>/dev/null`, coverage without a threshold, ...). When a dependency
# manifest changed, the layer named deps (deps_layer= in .ant/config) runs
# whatever its tier. A layer that cannot run on this task goes in
# .ant/work/<name>/skip as `<layer> <reason>`; no reason fails the run.
#
# Candidate layers for this repo's languages: `ant gauntlet suggest`.
# Examples -- replace them with this repo's commands:
# gate     | 1 | pass | scripts/precommit.sh
# types    | 2 | pass | npx tsc --noEmit
# deps     | 2 | pass | npm audit --audit-level=high
# control  | 2 | fail:forbidden import | scripts/check-imports.sh test/fixtures/bad-import
# mutants  | 3 | pass | scripts/mutants.sh -- npm test
